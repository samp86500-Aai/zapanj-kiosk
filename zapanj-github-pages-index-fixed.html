<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>ZAPANJ Joint class Kiosk</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap");

:root {
  font-family: "DM Sans", Arial, Helvetica, sans-serif;
  color: #252b4f;
  background: #edf0ed;
  font-synthesis: none;
  --surface: #edf0ed;
  --surface-high: #f4f6f3;
  --surface-low: #e4e7e4;
  --ink: #272d52;
  --muted: #737b8d;
  --blue: #343b6b;
  --blue-strong: #2b315d;
  --accent: #4267bf;
  --success: #347255;
  --shadow-raised: 13px 13px 28px rgba(163, 169, 166, .45), -13px -13px 28px rgba(255, 255, 255, .86);
  --shadow-raised-soft: 7px 7px 16px rgba(163, 169, 166, .36), -7px -7px 16px rgba(255, 255, 255, .82);
  --shadow-inset: inset 6px 6px 14px rgba(164, 170, 167, .34), inset -6px -6px 14px rgba(255, 255, 255, .8);
  --focus: 0 0 0 4px rgba(66, 103, 191, .2), var(--shadow-raised-soft);
}

* { box-sizing: border-box; }
html, body, #root { min-width: 320px; min-height: 100%; margin: 0; }
body { min-height: 100svh; background: var(--surface); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.brand-logo {
  width: min(68vw, 500px);
  height: auto;
  display: block;
  mix-blend-mode: multiply;
}
.brand-logo.compact { width: 132px; max-height: 64px; object-fit: contain; }

/* Start */
.start-screen {
  width: min(100%, 1024px);
  min-height: 100svh;
  margin: 0 auto;
  padding: clamp(26px, 5vh, 58px) clamp(22px, 7vw, 76px);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  color: var(--ink);
  text-align: center;
  overflow: hidden;
}
.start-logo-wrap {
  width: min(69vw, 700px);
  min-height: clamp(180px, 28vh, 290px);
  margin-top: 12vh;
  padding: clamp(28px, 4vw, 40px);
  border: 1px solid rgba(255, 255, 255, .76);
  border-radius: 42px;
  background: var(--surface);
  box-shadow: var(--shadow-raised);
  display: grid;
  place-items: center;
  animation: surface-rise 700ms cubic-bezier(.16, 1, .3, 1) both;
}
.start-logo-wrap .brand-logo { width: min(90%, 500px); animation: start-logo-idle 5.2s 900ms ease-in-out infinite; }
.start-copy {
  margin-top: clamp(38px, 6vh, 64px);
  display: grid;
  justify-items: center;
  gap: 12px;
  animation: content-arrive 620ms 120ms cubic-bezier(.16, 1, .3, 1) both;
}
.event-label,
.section-kicker {
  color: #7b8395;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.start-copy strong {
  color: var(--ink);
  font-size: clamp(58px, 9vw, 94px);
  line-height: .95;
  letter-spacing: -.055em;
}
.start-copy > span:last-child { font-size: clamp(19px, 2.6vw, 28px); }
.start-button {
  width: min(60vw, 620px);
  min-height: clamp(86px, 11vh, 112px);
  margin-top: clamp(34px, 5vh, 52px);
  border: 1px solid rgba(82, 91, 148, .46);
  border-radius: 999px;
  background: linear-gradient(145deg, #3a4275, #2c325f);
  box-shadow: 10px 12px 24px rgba(42, 48, 81, .25), -8px -8px 20px rgba(255, 255, 255, .8), inset 1px 1px 1px rgba(255,255,255,.3);
  color: #fff;
  cursor: pointer;
  font-size: clamp(25px, 3.8vw, 38px);
  font-weight: 700;
  letter-spacing: -.02em;
  transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
  animation: content-arrive 620ms 220ms cubic-bezier(.16, 1, .3, 1) both, start-button-ready 2.8s 1s ease-in-out infinite;
}
.start-button:hover { filter: brightness(1.07); transform: translateY(-2px); }
.start-button:focus-visible { outline: 0; box-shadow: var(--focus); }
.start-button:active { transform: translateY(3px) scale(.988); box-shadow: 3px 4px 10px rgba(42, 48, 81, .3), -3px -3px 9px rgba(255,255,255,.66), inset 4px 4px 10px rgba(18,22,54,.3); }
.start-progress {
  width: min(72vw, 700px);
  min-height: 88px;
  margin-top: clamp(34px, 5vh, 52px);
  padding: 14px 22px;
  border-radius: 999px;
  box-shadow: var(--shadow-inset);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  align-items: center;
  animation: content-arrive 620ms 300ms cubic-bezier(.16, 1, .3, 1) both;
}
.start-progress span { position: relative; display: grid; justify-items: center; gap: 7px; color: var(--muted); }
.start-progress span:not(:last-child)::after { content: ""; position: absolute; top: 17px; left: calc(50% + 24px); width: calc(100% - 48px); height: 2px; background: #c6cac8; }
.start-progress i,
.progress span {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow-raised-soft);
  display: grid;
  place-items: center;
  color: #737b8d;
  font-size: 12px;
  font-style: normal;
  font-weight: 700;
}
.start-progress b { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }

/* Unified kiosk shell */
.kiosk-app {
  width: min(100%, 1024px);
  min-height: 100svh;
  margin: 0 auto;
  background: var(--surface);
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
}
.kiosk-header {
  min-height: 112px;
  margin: 22px 24px 0;
  padding: 17px 24px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 28px;
  background: var(--surface);
  box-shadow: var(--shadow-raised-soft);
  display: grid;
  grid-template-columns: 150px 1fr 130px;
  align-items: center;
  gap: 28px;
}
.progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.progress > div { position: relative; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; color: #8a909d; }
.progress > div:not(:last-child)::after { content: ""; position: absolute; top: 17px; left: calc(50% + 22px); width: calc(100% - 44px); height: 2px; background: #cfd3d1; }
.progress > div.active span { color: #fff; background: var(--blue); box-shadow: 4px 4px 10px rgba(74,80,111,.25), -4px -4px 10px #fff; }
.progress > div.complete span { color: var(--success); }
.progress > div.active { color: var(--ink); }
.progress strong { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.staff-reset {
  justify-self: end;
  min-height: 48px;
  padding: 0 18px;
  border: 0;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--shadow-raised-soft);
  color: var(--ink);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: transform 150ms ease, box-shadow 150ms ease;
}
.staff-reset:active { transform: translateY(2px); box-shadow: var(--shadow-inset); }
.screen-stage { min-height: 0; display: grid; }
.kiosk-screen { width: min(100%, 760px); margin: 0 auto; padding: clamp(42px, 7vh, 74px) clamp(28px, 6vw, 58px); display: flex; flex-direction: column; justify-content: center; }
.screen-enter { animation: screen-enter 720ms cubic-bezier(.16, 1, .3, 1) both; }
.kiosk-screen > .heading-block { animation: page-heading-build 820ms 140ms cubic-bezier(.16,1,.3,1) both; }
.kiosk-screen > .heading-block .section-kicker { animation: page-kicker-build 650ms 110ms ease-out both; }
.kiosk-screen > .heading-block h1 { animation: page-title-build 880ms 190ms cubic-bezier(.16,1.08,.3,1) both; }
.kiosk-screen > .heading-block > p:last-child { animation: page-copy-build 720ms 360ms ease-out both; }
.kiosk-screen > .field-label,
.kiosk-screen > .search-box,
.kiosk-screen > .currency-field,
.kiosk-screen > .large-choice-grid,
.kiosk-screen > .amount-grid,
.kiosk-screen > .primary-button { animation: page-control-build 760ms 420ms cubic-bezier(.16,1,.3,1) both; }
.heading-block { margin: 0 0 clamp(32px, 5vh, 52px); }
.heading-block h1 { margin: 0; color: var(--ink); font-size: clamp(52px, 8vw, 84px); line-height: .98; letter-spacing: -.055em; }
.heading-block > p:last-child { max-width: 620px; margin: 18px 0 0; color: #525a6a; font-size: clamp(18px, 2.4vw, 23px); line-height: 1.48; }
.section-kicker { margin: 0 0 14px; }
.field-label { display: block; margin: 0 0 12px 8px; font-size: 16px; font-weight: 600; }

.search-box, .currency-field {
  min-height: 80px;
  border: 1px solid rgba(255,255,255,.54);
  border-radius: 24px;
  background: var(--surface-low);
  box-shadow: var(--shadow-inset);
  display: flex;
  align-items: center;
  transition: box-shadow 180ms ease, background 180ms ease;
}
.search-box:focus-within, .currency-field:focus-within { background: var(--surface); box-shadow: inset 4px 4px 10px rgba(164,170,167,.28), inset -4px -4px 10px #fff, 0 0 0 4px rgba(66,103,191,.18); }
.search-box input, .currency-field input { min-width: 0; flex: 1; border: 0; outline: 0; padding: 0 24px; background: transparent; color: var(--ink); font-size: 23px; }
.search-box input::placeholder, .currency-field input::placeholder { color: #9298a4; }
.search-box button { min-height: 48px; margin-right: 14px; padding: 0 17px; border: 0; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-raised-soft); color: var(--accent); cursor: pointer; }
.currency-field { margin-bottom: 28px; }
.currency-field span { padding-left: 25px; color: var(--ink); font-size: 32px; font-weight: 600; }
.currency-field input { font-size: 32px; }
.guest-results { min-height: 190px; margin-top: 22px; display: grid; gap: 14px; align-content: start; }
.search-result-set { display: grid; gap: 14px; perspective: 900px; }
.suggestion-prompt {
  min-height: 92px;
  padding: 18px 22px;
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow-inset);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  animation: suggestion-prompt-in 720ms cubic-bezier(.16,1,.3,1) both;
}
.suggestion-prompt strong { color: var(--ink); font-size: clamp(20px, 3vw, 27px); letter-spacing: -.025em; }
.suggestion-prompt span { color: var(--muted); font-size: 14px; text-align: right; }
.searching-state {
  min-height: 154px;
  padding: 28px;
  border: 1px solid rgba(255,255,255,.56);
  border-radius: 24px;
  background: var(--surface-low);
  box-shadow: var(--shadow-inset);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 15px;
  color: var(--ink);
  overflow: hidden;
  animation: search-surface-in 260ms cubic-bezier(.16,1,.3,1) both;
}
.searching-word { display: flex; align-items: baseline; justify-content: center; font-size: clamp(25px, 4vw, 36px); font-weight: 700; letter-spacing: -.035em; }
.searching-word i {
  display: inline-block;
  font-style: normal;
  animation: searching-letter 950ms calc(var(--letter) * 55ms) cubic-bezier(.45,0,.2,1) infinite;
}
.searching-query { color: var(--muted); font-size: 14px; animation: search-query-pulse 950ms ease-in-out infinite alternate; }
.guest-row {
  width: 100%; min-height: 88px; padding: 17px 20px; border: 1px solid rgba(255,255,255,.62); border-radius: 22px;
  background: var(--surface); box-shadow: var(--shadow-raised-soft); display: flex; align-items: center; justify-content: space-between; gap: 24px;
  color: var(--ink); text-align: left; cursor: pointer; transition: transform 150ms ease, box-shadow 150ms ease;
  transform-origin: 50% 30%;
  animation: result-card-pop 480ms calc(var(--result) * 75ms) cubic-bezier(.16,1.25,.3,1) both;
}
.guest-row:hover, .guest-row:focus-visible { outline: 0; transform: translateY(-2px); box-shadow: 9px 9px 20px rgba(163,169,166,.42), -9px -9px 20px #fff; }
.guest-row:active { transform: translateY(2px); box-shadow: var(--shadow-inset); }
.guest-row:disabled { cursor: default; }
.guest-results.is-choosing .guest-row:not(.is-selected) { animation: guest-row-dismiss 360ms ease both; }
.guest-row.is-selected { z-index: 2; animation: guest-selected 680ms cubic-bezier(.16,1.12,.3,1) both; }
.guest-row.is-selected .guest-copy { animation: guest-copy-confirm 600ms cubic-bezier(.16,1,.3,1) both; }
.guest-row.is-selected .select-label { color: var(--success); animation: guest-label-confirm 520ms 90ms cubic-bezier(.16,1.15,.3,1) both; }
.guest-row strong, .guest-row small { display: block; }
.guest-copy { opacity: 0; animation: result-copy-reveal 400ms calc(170ms + var(--result) * 75ms) cubic-bezier(.16,1,.3,1) both; }
.guest-row strong { margin-bottom: 5px; font-size: 19px; }
.guest-row small, .quiet-message { color: var(--muted); font-size: 14px; }
.select-label { color: var(--accent); font-size: 15px; font-weight: 700; opacity: 0; animation: result-select-reveal 320ms calc(260ms + var(--result) * 75ms) ease-out both; }
.quiet-message { margin: 0; padding: 30px 8px; line-height: 1.55; }
.result-empty { animation: result-copy-reveal 420ms cubic-bezier(.16,1,.3,1) both; }
.action-confirmation {
  position: fixed;
  z-index: 20;
  inset: 0;
  padding: clamp(24px, 6vw, 70px);
  background: rgba(237, 240, 237, .94);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  color: var(--ink);
  text-align: center;
  animation: confirmation-backdrop-in 420ms ease-out both;
}
.action-confirmation::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: min(78vw, 670px);
  min-height: min(46vh, 430px);
  border: 1px solid rgba(255,255,255,.72);
  border-radius: clamp(30px, 6vw, 54px);
  background: var(--surface);
  box-shadow: 18px 20px 42px rgba(143,150,147,.42), -16px -16px 36px rgba(255,255,255,.9);
  animation: confirmation-card-in 760ms cubic-bezier(.16,1.15,.3,1) both;
}
.action-confirmation > span {
  color: var(--success);
  font-size: clamp(14px, 2.2vw, 21px);
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  animation: confirmation-label-in 620ms 220ms ease-out both;
}
.action-confirmation > strong {
  max-width: 760px;
  font-size: clamp(48px, 9vw, 92px);
  line-height: 1;
  letter-spacing: -.05em;
  animation: confirmation-title-in 820ms 260ms cubic-bezier(.16,1.12,.3,1) both;
}
.action-confirmation > p {
  margin: 0;
  color: #50596a;
  font-size: clamp(21px, 3vw, 30px);
  line-height: 1.35;
  animation: confirmation-copy-in 680ms 440ms ease-out both;
}
.confirmation-no > span { color: var(--muted); }
.amount-confirmation > strong { color: var(--blue); font-size: clamp(64px, 13vw, 126px); }
.text-action { align-self: center; min-height: 48px; margin-top: 22px; padding: 0 18px; border: 0; background: transparent; color: var(--accent); cursor: pointer; font-weight: 600; }

.primary-button, .outline-button, .amount-grid button {
  border: 1px solid rgba(255,255,255,.66); border-radius: 24px; cursor: pointer; font-weight: 600;
  transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
}
.primary-button, .outline-button { width: 100%; min-height: 72px; padding: 14px 24px; }
.primary-button { background: var(--blue); color: #fff; border-color: rgba(65,73,122,.55); box-shadow: 8px 9px 18px rgba(67,73,105,.26), -7px -7px 16px #fff, inset 1px 1px 1px rgba(255,255,255,.22); }
.outline-button { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-raised-soft); }
.primary-button.large, .outline-button.large { min-height: 108px; font-size: clamp(20px, 3vw, 26px); }
.primary-button:hover, .primary-button:focus-visible { outline: 0; filter: brightness(1.08); transform: translateY(-2px); }
.outline-button:hover, .outline-button:focus-visible, .amount-grid button:hover, .amount-grid button:focus-visible { outline: 0; transform: translateY(-2px); box-shadow: 9px 9px 20px rgba(163,169,166,.43), -9px -9px 20px #fff; }
.primary-button:active, .outline-button:active, .amount-grid button:active { transform: translateY(2px) scale(.99); box-shadow: var(--shadow-inset); }
.primary-button:disabled { opacity: .36; cursor: default; filter: none; transform: none; }
.large-choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.choice-screen, .thanks-screen { text-align: center; align-items: center; }
.choice-screen .heading-block, .thanks-screen .heading-block { max-width: 690px; }
.choice-screen .heading-block > p:last-child, .thanks-screen .heading-block > p:last-child { margin-inline: auto; }
.choice-response { min-height: 24px; margin: 24px 0 0; color: var(--success); font-size: 15px; font-weight: 600; }
.choice-yes .heading-block { animation: happy-heading 720ms cubic-bezier(.16,1.2,.3,1) both; }
.choice-yes .donate-yes { opacity: 1; animation: happy-yes-button 760ms cubic-bezier(.16,1.25,.3,1) both; }
.choice-yes .donate-no { animation: option-soft-exit 360ms ease both; }
.choice-yes .choice-response { animation: happy-copy-arrive 520ms 170ms cubic-bezier(.16,1,.3,1) both; }
.choice-no .donate-no { opacity: 1; animation: calm-no-button 560ms cubic-bezier(.16,1,.3,1) both; }
.choice-no .donate-yes { animation: option-soft-exit 300ms ease both; }
.choice-no .choice-response { color: var(--muted); animation: calm-copy-arrive 420ms 100ms ease-out both; }
.confirmation-line, .demo-badge { display: inline-block; margin-bottom: 30px; padding: 10px 16px; border: 0; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-inset); color: var(--success); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.amount-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.amount-grid button { min-height: 138px; background: var(--surface); box-shadow: var(--shadow-raised-soft); color: var(--ink); font-size: clamp(34px, 6vw, 52px); transform-style: preserve-3d; }
.amount-grid button:disabled { cursor: default; }
.amount-grid button:disabled:not(.is-animating) { opacity: .42; transform: scale(.96); box-shadow: var(--shadow-inset); }
.amount-value { display: inline-block; }
.amount-2.is-animating { opacity: 1; animation: amount-two-card 760ms cubic-bezier(.16,1.2,.3,1) both; }
.amount-2.is-animating .amount-value { animation: amount-two-value 720ms cubic-bezier(.16,1.25,.3,1) both; }
.amount-5.is-animating { opacity: 1; animation: amount-five-card 760ms cubic-bezier(.16,1.1,.3,1) both; }
.amount-5.is-animating .amount-value { animation: amount-five-value 720ms cubic-bezier(.16,1.2,.3,1) both; }
.amount-10.is-animating { opacity: 1; animation: amount-ten-card 760ms cubic-bezier(.16,1.1,.3,1) both; }
.amount-10.is-animating .amount-value { animation: amount-ten-value 720ms cubic-bezier(.16,1.15,.3,1) both; }
.amount-custom.is-animating { opacity: 1; animation: amount-custom-card 760ms cubic-bezier(.16,1.1,.3,1) both; }
.amount-custom.is-animating .amount-value { animation: amount-custom-value 720ms cubic-bezier(.16,1.1,.3,1) both; }

.handoff-screen { text-align: center; align-items: center; }
.handoff-screen .brand-logo.compact { width: min(34vw, 180px); margin-bottom: 30px; }
.handoff-screen .heading-block { max-width: 680px; margin-bottom: 18px; }
.handoff-screen .heading-block > p:last-child { margin-inline: auto; }
.demo-badge { color: var(--muted); }
.handoff-loader { width: min(100%, 520px); height: 16px; margin-bottom: 40px; padding: 4px; border-radius: 999px; box-shadow: var(--shadow-inset); overflow: hidden; }
.handoff-loader span { display: block; width: 34%; height: 8px; border-radius: 999px; background: var(--blue); animation: handoff-progress 1050ms cubic-bezier(.45,0,.35,1) infinite; }
.handoff-note, .reset-note { margin: 0; color: var(--muted); font-size: 13px; }
.returning-screen .brand-logo { width: min(54vw, 360px); margin-bottom: 30px; }
.thanks-screen .brand-logo { width: min(58vw, 380px); margin-bottom: 38px; padding: 26px; border-radius: 30px; box-shadow: var(--shadow-raised-soft); }
.thanks-screen .brand-logo { animation: thanks-logo-arrive 850ms cubic-bezier(.16,1.16,.3,1) both, thanks-logo-float 3.4s 900ms ease-in-out infinite; }
.thanks-screen .confirmation-line { animation: thanks-complete-pop 620ms 260ms cubic-bezier(.16,1.25,.3,1) both; }
.thanks-screen .heading-block h1 { animation: thanks-title-arrive 760ms 380ms cubic-bezier(.16,1.18,.3,1) both; }
.thanks-screen .heading-block > p:last-child { animation: happy-copy-arrive 560ms 520ms cubic-bezier(.16,1,.3,1) both; }
.thanks-screen .primary-button { max-width: 480px; }
.reset-note { margin-top: 20px; }
.reset-progress { width: min(100%, 300px); height: 8px; margin-top: 12px; border: 0; border-radius: 999px; overflow: hidden; background: var(--surface-low); box-shadow: var(--shadow-inset); appearance: none; }
.reset-progress::-webkit-progress-bar { background: transparent; }
.reset-progress::-webkit-progress-value { border-radius: 999px; background: var(--blue); transition: width 800ms cubic-bezier(.16,1,.3,1); }
.reset-progress::-moz-progress-bar { border-radius: 999px; background: var(--blue); transition: width 800ms cubic-bezier(.16,1,.3,1); }

<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;
const SQUARE_CONFIG = {
  // Replace with the Application ID from Square Developer Console.
  applicationId: "REPLACE_WITH_SQUARE_APPLICATION_ID",

  // This must be the exact HTTPS callback URL registered under
  // Square Developer Console → Point of Sale API → Web.
  callbackUrl: "https://samp86500-aai.github.io/zapanj-kiosk/square-callback.html",

  // Optional. Leave blank to use whichever Square location is signed in.
  locationId: "",
};

const PENDING_PAYMENT_KEY = "zapanj.square.pending.v1";
const SQUARE_RESULT_KEY = "zapanj.square.result.v1";

function createPaymentSession({ guest, recipient, amount }) {
  const id = globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  return {
    id,
    guest,
    recipient,
    amount: Number(amount),
    amountCents: Math.round(Number(amount) * 100),
    event: "Joint class",
    createdAt: Date.now(),
  };
}

function savePendingPayment(session) {
  try { localStorage.setItem(PENDING_PAYMENT_KEY, JSON.stringify(session)); } catch {}
}

function loadPendingPayment() {
  try {
    const raw = localStorage.getItem(PENDING_PAYMENT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function clearPendingPayment() {
  try { localStorage.removeItem(PENDING_PAYMENT_KEY); } catch {}
}

function consumeSquareResult() {
  try {
    const raw = localStorage.getItem(SQUARE_RESULT_KEY);
    if (!raw) return null;
    localStorage.removeItem(SQUARE_RESULT_KEY);
    return JSON.parse(raw);
  } catch { return null; }
}

function buildSquarePaymentURL(session) {
  if (!session || !Number.isInteger(session.amountCents) || session.amountCents <= 0) {
    throw new Error("Invalid donation amount.");
  }
  if (!["ZAPANJ", "ZACUCE"].includes(session.recipient)) {
    throw new Error("Choose a valid donation recipient.");
  }
  if (!SQUARE_CONFIG.applicationId || SQUARE_CONFIG.applicationId.startsWith("REPLACE_")) {
    throw new Error("Square Application ID has not been configured yet.");
  }
  if (!/^https:\/\//i.test(SQUARE_CONFIG.callbackUrl) || SQUARE_CONFIG.callbackUrl.includes("REPLACE_")) {
    throw new Error("Square HTTPS callback URL has not been configured yet.");
  }

  const data = {
    amount_money: {
      amount: String(session.amountCents),
      currency_code: "USD",
    },
    callback_url: SQUARE_CONFIG.callbackUrl,
    client_id: SQUARE_CONFIG.applicationId,
    version: "1.3",
    state: session.id,
    notes: `${session.recipient} donation · Joint class`,
    options: {
      supported_tender_types: ["CREDIT_CARD"],
      auto_return: true,
      skip_receipt: true,
      clear_default_fees: true,
    },
  };

  if (SQUARE_CONFIG.locationId) data.location_id = SQUARE_CONFIG.locationId;

  return `square-commerce-v1://payment/create?data=${encodeURIComponent(JSON.stringify(data))}`;
}

function launchSquareFromSafari(session) {
  savePendingPayment(session);
  const squareURL = buildSquarePaymentURL(session);

  window.location.assign(squareURL);
}

function getSquareReturnBootstrap() {
  const result = consumeSquareResult();
  if (!result) return null;

  const pending = loadPendingPayment();
  if (!pending) {
    return { step: "paymentError", paymentError: "Square returned, but the kiosk payment session was missing." };
  }

  if (result.state && result.state !== pending.id) {
    return { step: "paymentError", paymentError: "The returned Square payment did not match this kiosk session.", pending };
  }

  if (result.status === "ok" && !result.error_code) {
    return { step: "squareReturning", pending, squareResult: result };
  }

  if (result.error_code === "payment_canceled") {
    return { step: "amounts", pending, squareResult: result };
  }

  return {
    step: "paymentError",
    pending,
    squareResult: result,
    paymentError: result.error_code ? `Square error: ${result.error_code.replaceAll("_", " ")}.` : "Square could not complete the payment.",
  };
}

function normalizeName(value) {
  return value.toLowerCase().replace(/[^a-z0-9]/g, "");
}

function editDistance(left, right) {
  const previous = Array.from({ length: right.length + 1 }, (_, index) => index);
  for (let row = 1; row <= left.length; row += 1) {
    let diagonal = previous[0];
    previous[0] = row;
    for (let column = 1; column <= right.length; column += 1) {
      const above = previous[column];
      previous[column] = Math.min(
        previous[column] + 1,
        previous[column - 1] + 1,
        diagonal + (left[row - 1] === right[column - 1] ? 0 : 1),
      );
      diagonal = above;
    }
  }
  return previous[right.length];
}

function guestMatchScore(guest, query) {
  const cleanQuery = normalizeName(query);
  const fullName = normalizeName(guest.name);
  const firstName = normalizeName(guest.name.split(" ")[0]);
  if (!cleanQuery) return 0;
  if (fullName.includes(cleanQuery)) return 100 - (fullName.length - cleanQuery.length);
  if (firstName.includes(cleanQuery) || cleanQuery.includes(firstName)) return 88;

  const queryLetters = [...cleanQuery].sort().join("");
  const firstNameLetters = [...firstName].sort().join("");
  if (cleanQuery.length >= 3 && queryLetters === firstNameLetters) return 78;

  const firstDistance = editDistance(firstName, cleanQuery);
  const fullDistance = editDistance(fullName, cleanQuery);
  const bestSimilarity = Math.max(
    1 - firstDistance / Math.max(firstName.length, cleanQuery.length),
    1 - fullDistance / Math.max(fullName.length, cleanQuery.length),
  );
  return bestSimilarity >= .55 ? Math.round(bestSimilarity * 70) : 0;
}

function Progress({ step }) {
  const active = progressForStep[step] ?? 0;
  const labels = ["Check in", "Donate", "Done"];
  return (
    <div className="progress" aria-label={`Step ${active + 1} of 3: ${labels[active]}`}>
      {labels.map((label, index) => (
        <div key={label} className={index === active ? "active" : index < active ? "complete" : ""}>
          <span>{index + 1}</span>
          <strong>{label}</strong>
        </div>
      ))}
    </div>
  );
}

function Screen({ children, step, className = "" }) {
  return (
    <section key={step} className={`kiosk-screen screen-enter ${className}`} data-step={step}>
      {children}
    </section>
  );
}

function StartScreen({ onStart }) {
  return (
    <main className="start-screen">
      <div className="start-logo-wrap"><Logo /></div>
      <div className="start-copy">
        <span className="event-label">Joint class · Event kiosk</span>
        <strong>Welcome</strong>
        <span>We’re glad you’re here.</span>
      </div>
      <button className="start-button" onClick={onStart} aria-label="Tap to begin ZAPANJ event check-in">
        <span>Tap to begin</span>
      </button>
      <div className="start-progress" aria-label="Check in, donate, and finish">
        <span><i>1</i><b>Check in</b></span>
        <span><i>2</i><b>Donate</b></span>
        <span><i>3</i><b>Done</b></span>
      </div>
    </main>
  );
}

function CheckInScreen({ query, setQuery, onSelect, onCantFind }) {
  const inputRef = useRef(null);
  const selectTimerRef = useRef(null);
  const [isSearching, setIsSearching] = useState(false);
  const [selectedGuest, setSelectedGuest] = useState(null);
  const selectedGuestId = selectedGuest?.id ?? null;
  const searchResult = useMemo(() => {
    const clean = query.trim();
    if (!clean) return { matches: [], isCorrection: false };

    const normalizedQuery = normalizeName(clean);
    const directMatches = guests.filter((guest) => normalizeName(guest.name).includes(normalizedQuery));
    if (directMatches.length > 0) {
      return { matches: directMatches.slice(0, 4), isCorrection: false };
    }

    const correctedMatches = guests
      .map((guest) => ({ guest, score: guestMatchScore(guest, clean) }))
      .filter(({ score }) => score > 0)
      .sort((left, right) => right.score - left.score)
      .slice(0, 4)
      .map(({ guest }) => guest);
    return { matches: correctedMatches, isCorrection: correctedMatches.length > 0 };
  }, [query]);
  const matches = searchResult.matches;

  useEffect(() => inputRef.current?.focus(), []);

  useEffect(() => () => window.clearTimeout(selectTimerRef.current), []);

  useEffect(() => {
    if (!query.trim()) {
      setIsSearching(false);
      return undefined;
    }

    setIsSearching(true);
    const timer = window.setTimeout(() => setIsSearching(false), 260);
    return () => window.clearTimeout(timer);
  }, [query]);

  const selectGuest = (guest) => {
    if (selectedGuestId) return;
    setSelectedGuest(guest);
    selectTimerRef.current = window.setTimeout(() => onSelect(guest), 2200);
  };

  return (
    <Screen step="checkin" className="checkin-screen">
      <div className="heading-block">
        <p className="section-kicker">ZAPANJ Joint class</p>
        <h1>Check In</h1>
        <p>Start typing and matching names appear automatically. Tap your name when you see it.</p>
      </div>

      <label className="field-label" htmlFor="guest-search">Find your name</label>
      <div className="search-box">
        <input
          ref={inputRef}
          id="guest-search"
          type="search"
          inputMode="search"
          autoComplete="off"
          placeholder="Type your name"
          value={query}
          onChange={(event) => setQuery(event.target.value)}
          onKeyDown={(event) => {
            if (event.key === "Enter" && matches.length > 0 && !selectedGuestId) {
              event.preventDefault();
              selectGuest(matches[0]);
            }
          }}
        />
        {query && <button onClick={() => setQuery("")}>Clear</button>}
      </div>

      <div className={`guest-results ${selectedGuestId ? "is-choosing" : ""}`} aria-live="polite" aria-busy={isSearching}>
        {!query.trim() && <p className="quiet-message">Your search stays private and clears after check-in.</p>}
        {query.trim() && isSearching && (
          <div className="searching-state" role="status">
            <span className="searching-word" aria-label="Searching">
              {"Searching".split("").map((letter, index) => <i key={`${letter}-${index}`} style={{ "--letter": index }}>{letter}</i>)}
            </span>
            <span className="searching-query">Looking for “{query.trim()}”</span>
          </div>
        )}
        {query.trim() && !isSearching && (
          <div className="search-result-set" key={query.trim().toLowerCase()}>
            {matches.length === 0 && <p className="quiet-message result-empty">We couldn’t find that name. Please ask a ZAPANJ volunteer for help.</p>}
            {searchResult.isCorrection && matches.length > 0 && (
              <div className="suggestion-prompt" role="status">
                <strong>Is this who you meant?</strong>
                <span>Select the correct name below.</span>
              </div>
            )}
            {matches.map((guest, index) => (
              <button
                key={guest.id}
                className={`guest-row ${selectedGuestId === guest.id ? "is-selected" : ""}`}
                style={{ "--result": index }}
                onClick={() => selectGuest(guest)}
                disabled={Boolean(selectedGuestId)}
              >
                <span className="guest-copy"><strong>{guest.name}</strong><small>{guest.detail}</small></span>
                <span className="select-label">{selectedGuestId === guest.id ? "Checked in" : "Select"}</span>
              </button>
            ))}
          </div>
        )}
      </div>

      <button className="text-action" onClick={onCantFind}>I can’t find my name</button>
      {selectedGuest && (
        <div className="action-confirmation guest-confirmation" role="status" aria-live="assertive">
          <span>Check-in confirmed</span>
          <strong>{selectedGuest.name}</strong>
          <p>You are checked in.</p>
        </div>
      )}
    </Screen>
  );
}

function DonationQuestion({ guest, onYes, onNo }) {
  const firstName = guest?.name.split(" ")[0] ?? "there";

  return (
    <Screen step="donateAsk" className="choice-screen">
      <div className="confirmation-line">Checked in</div>
      <div className="heading-block">
        <p className="section-kicker">Welcome, {firstName}</p>
        <h1>Would you like to donate?</h1>
        <p>Your gift supports ZAPANJ programs, events, and our community.</p>
      </div>
      <div className="large-choice-grid">
        <button className="primary-button large donate-yes" onClick={onYes}>Yes, I’d like to donate</button>
        <button className="outline-button large donate-no" onClick={onNo}>No, thank you</button>
      </div>
    </Screen>
  );
}

function DonationRecipientScreen({ onSelect }) {
  return (
    <Screen step="donateTo" className="choice-screen recipient-screen">
      <div className="heading-block">
        <p className="section-kicker">Choose where your gift goes</p>
        <h1>Who would you like to donate to?</h1>
        <p>Select the fund you would like your donation to support.</p>
      </div>
      <div className="recipient-choice-grid">
        <button className="outline-button recipient-choice" onClick={() => onSelect("ZAPANJ")}>
          <strong>ZAPANJ</strong>
          <span>Event organizer</span>
        </button>
        <button className="outline-button recipient-choice" onClick={() => onSelect("ZACUCE")}>
          <strong>ZACUCE</strong>
          <span>Building fund for ZAPANJ</span>
        </button>
      </div>
    </Screen>
  );
}

function AmountScreen({ onAmount, onCustom }) {
  return (
    <Screen step="amounts" className="amount-screen">
      <div className="heading-block">
        <p className="section-kicker">Optional donation</p>
        <h1>Choose an amount</h1>
        <p>Every contribution makes a difference.</p>
      </div>
      <div className="amount-grid" aria-label="Donation amount">
        {[25, 50, 100].map((amount) => (
          <button key={amount} onClick={() => onAmount(amount)}>
            <span className="amount-value">${amount}</span>
          </button>
        ))}
        <button className="amount-custom" onClick={onCustom}><span className="amount-value">Custom</span></button>
      </div>
      <button className="text-action" onClick={() => onAmount(null)}>Skip donation</button>
    </Screen>
  );
}

function ManualCheckInScreen({ onBack, onContinue }) {
  const [name, setName] = useState("");
  const cleanName = name.trim();

  return (
    <Screen step="manualCheckin" className="manual-checkin-screen">
      <div className="heading-block">
        <p className="section-kicker">ZAPANJ Joint class</p>
        <h1>Check in manually</h1>
        <p>Enter your full name and a volunteer can match it to the guest list later.</p>
      </div>
      <label className="field-label" htmlFor="manual-name">Full name</label>
      <div className="search-box">
        <input
          id="manual-name"
          type="text"
          autoComplete="name"
          placeholder="First and last name"
          value={name}
          onChange={(event) => setName(event.target.value)}
          onKeyDown={(event) => {
            if (event.key === "Enter" && cleanName.length >= 2) {
              event.preventDefault();
              onContinue({ id: `manual-${Date.now()}`, name: cleanName, detail: "Manual check-in · Joint class" });
            }
          }}
          autoFocus
        />
      </div>
      <button
        className="primary-button"
        disabled={cleanName.length < 2}
        onClick={() => onContinue({ id: `manual-${Date.now()}`, name: cleanName, detail: "Manual check-in · Joint class" })}
      >
        Continue
      </button>
      <button className="text-action" onClick={onBack}>Back to search</button>
    </Screen>
  );
}

function CustomAmountScreen({ onBack, onContinue }) {
  const [value, setValue] = useState("");
  const amount = Number(value);
  return (
    <Screen step="custom" className="custom-screen">
      <div className="heading-block">
        <p className="section-kicker">Optional donation</p>
        <h1>Custom Amount</h1>
        <p>Enter any donation amount.</p>
      </div>
      <label className="field-label" htmlFor="custom-amount">Donation amount</label>
      <div className="currency-field">
        <span>$</span>
        <input
          id="custom-amount"
          inputMode="decimal"
          type="text"
          pattern="[0-9]*[.]?[0-9]*"
          placeholder="0.00"
          value={value}
          onChange={(event) => {
            const next = event.target.value;
            if (/^\d*(?:\.\d{0,2})?$/.test(next)) setValue(next);
          }}
          onKeyDown={(event) => {
            if (["e", "E", "+", "-", ","].includes(event.key)) event.preventDefault();
            if (event.key === "Enter" && amount > 0) {
              event.preventDefault();
              onContinue(amount);
            }
          }}
          autoFocus
        />
      </div>
      <button className="primary-button" disabled={!amount || amount <= 0} onClick={() => onContinue(amount)}>Continue</button>
      <button className="text-action" onClick={onBack}>Back</button>
    </Screen>
  );
}

function TimedStep({ delay, onDone }) {
  useEffect(() => {
    const timer = window.setTimeout(onDone, delay);
    return () => window.clearTimeout(timer);
  }, [delay, onDone]);

  return null;
}


function SquareLaunchingScreen({ amount, recipient }) {
  return (
    <Screen step="squareLaunching" className="handoff-screen">
      <Logo compact />
      <div className="handoff-loader" aria-hidden="true"><span /></div>
      <div className="heading-block">
        <p className="section-kicker">{recipient} donation · ${amount.toFixed(2)}</p>
        <h1>Opening payment</h1>
        <p>Square is opening with your donation amount already entered.</p>
      </div>
      <p className="handoff-note">After payment, Square will return to this kiosk automatically.</p>
    </Screen>
  );
}

function PaymentErrorScreen({ message, onRetry, onBack }) {
  return (
    <Screen step="squareLaunching" className="choice-screen payment-error-screen">
      <div className="heading-block">
        <p className="section-kicker">Payment needs attention</p>
        <h1>Square couldn’t finish.</h1>
        <p>{message || "Please ask a ZAPANJ volunteer for help."}</p>
      </div>
      <div className="large-choice-grid">
        <button className="primary-button large" onClick={onRetry}>Try payment again</button>
        <button className="outline-button large" onClick={onBack}>Change amount</button>
      </div>
    </Screen>
  );
}

function SquareReturningScreen({ recipient, transactionId, onReturned }) {
  return (
    <Screen step="squareReturning" className="handoff-screen returning-screen">
      <TimedStep delay={1150} onDone={onReturned} />
      <Logo />
      <div className="handoff-loader" aria-hidden="true"><span /></div>
      <div className="heading-block">
        <p className="section-kicker">Payment approved · {recipient}</p>
        <h1>Returning to ZAPANJ</h1>
        <p>Your payment was approved. Finishing your kiosk session now.</p>
      </div>
      {transactionId && <p className="handoff-note">Payment reference saved.</p>}
    </Screen>
  );
}

function ThankYouScreen({ guest, amount, recipient, onReset }) {
  const [seconds, setSeconds] = useState(8);
  const firstName = guest?.name.split(" ")[0] ?? "friend";

  useEffect(() => {
    const ticker = window.setInterval(() => setSeconds((current) => Math.max(0, current - 1)), 1000);
    const reset = window.setTimeout(onReset, 8000);
    return () => {
      window.clearInterval(ticker);
      window.clearTimeout(reset);
    };
  }, [onReset]);

  return (
    <Screen step="thanks" className={`thanks-screen ${amount ? "with-donation" : "checkin-only"}`}>
      <Logo />
      <div className="confirmation-line">Complete</div>
      <div className="heading-block">
        <h1>Thank you, {firstName}.</h1>
        <p>{amount ? `Your $${amount.toFixed(2)} donation to ${recipient} was received and you’re checked in.` : "You’re checked in. Enjoy the event!"}</p>
      </div>
      <button className="primary-button" onClick={onReset}>Done</button>
      <p className="reset-note">This screen will reset for the next guest in {seconds} seconds.</p>
      <progress className="reset-progress" max="8" value={seconds} aria-label={`Resetting in ${seconds} seconds`} />
    </Screen>
  );
}

function App() {
  const returnedPending = squareBoot?.pending ?? null;
  const [step, setStep] = useState(squareBoot?.step ?? "start");
  const [query, setQuery] = useState("");
  const [guest, setGuest] = useState(returnedPending?.guest ?? null);
  const [amount, setAmount] = useState(returnedPending?.amount ?? null);
  const [donationRecipient, setDonationRecipient] = useState(returnedPending?.recipient ?? null);
  const [paymentSession, setPaymentSession] = useState(returnedPending ?? null);
  const [paymentError, setPaymentError] = useState(squareBoot?.paymentError ?? "");
  const [squareResult, setSquareResult] = useState(squareBoot?.squareResult ?? null);

  const reset = () => {
    clearPendingPayment();
    setStep("start");
    setQuery("");
    setGuest(null);
    setAmount(null);
    setDonationRecipient(null);
    setPaymentSession(null);
    setPaymentError("");
    setSquareResult(null);
  };

  const beginPayment = (selectedAmount) => {
    const session = createPaymentSession({
      guest,
      recipient: donationRecipient,
      amount: selectedAmount,
    });

    setAmount(selectedAmount);
    setPaymentSession(session);
    setPaymentError("");
    setStep("squareLaunching");

    try {
      launchSquareFromSafari(session);
    } catch (error) {
      setPaymentError(error instanceof Error ? error.message : "Could not open Square.");
      setStep("paymentError");
    }
  };

  const retryPayment = () => {
    if (!paymentSession) {
      setPaymentError("No payment session is available. Please choose the donation amount again.");
      setStep("paymentError");
      return;
    }

    setPaymentError("");
    setStep("squareLaunching");
    try {
      launchSquareFromSafari(paymentSession);
    } catch (error) {
      setPaymentError(error instanceof Error ? error.message : "Could not open Square.");
      setStep("paymentError");
    }
  };

  if (step === "start") return <StartScreen onStart={() => setStep("checkin")} />;

  return (
    <main className="kiosk-app">
      <header className="kiosk-header">
        <Logo compact />
        <Progress step={step} />
        <button className="staff-reset" onClick={reset}>Start over</button>
      </header>
      <div className="screen-stage">
        {step === "checkin" && (
          <CheckInScreen
            query={query}
            setQuery={setQuery}
            onSelect={(selectedGuest) => { setGuest(selectedGuest); setStep("donateAsk"); }}
            onCantFind={() => setStep("manualCheckin")}
          />
        )}
        {step === "manualCheckin" && (
          <ManualCheckInScreen
            onBack={() => setStep("checkin")}
            onContinue={(manualGuest) => { setGuest(manualGuest); setStep("donateAsk"); }}
          />
        )}
        {step === "donateAsk" && (
          <DonationQuestion
            guest={guest}
            onYes={() => setStep("donateTo")}
            onNo={() => {
              clearPendingPayment();
              setDonationRecipient(null);
              setAmount(null);
              setPaymentSession(null);
              setStep("thanks");
            }}
          />
        )}
        {step === "donateTo" && (
          <DonationRecipientScreen
            onSelect={(recipient) => {
              setDonationRecipient(recipient);
              setStep("amounts");
            }}
          />
        )}
        {step === "amounts" && (
          <AmountScreen
            onAmount={(selected) => {
              if (selected === null) {
                clearPendingPayment();
                setAmount(null);
                setPaymentSession(null);
                setStep("thanks");
              } else {
                beginPayment(selected);
              }
            }}
            onCustom={() => setStep("custom")}
          />
        )}
        {step === "custom" && (
          <CustomAmountScreen
            onBack={() => setStep("amounts")}
            onContinue={(selected) => beginPayment(selected)}
          />
        )}
        {step === "squareLaunching" && amount && (
          <SquareLaunchingScreen amount={amount} recipient={donationRecipient} />
        )}
        {step === "paymentError" && (
          <PaymentErrorScreen
            message={paymentError}
            onRetry={retryPayment}
            onBack={() => setStep("amounts")}
          />
        )}
        {step === "squareReturning" && (
          <SquareReturningScreen
            recipient={donationRecipient}
            transactionId={squareResult?.transaction_id || squareResult?.client_transaction_id}
            onReturned={() => {
              clearPendingPayment();
              setStep("thanks");
            }}
          />
        )}
        {step === "thanks" && (
          <ThankYouScreen
            guest={guest}
            amount={amount}
            recipient={donationRecipient}
            onReset={reset}
          />
        )}
      </div>
      <footer className="kiosk-footer">
        <span>Private guest check-in</span>
        <span>ZAPANJ · Safari kiosk</span>
      </footer>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
